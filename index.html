<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algoritmusok – beugró kártyák</title>
<meta name="theme-color" content="#1d2540">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f8; --surface:#fff; --ink:#1a2038; --muted:#5b6482; --line:#d9deec;
  --brand:#3d4fd6; --brand-ink:#fff;
  --yes:#0f7a5a; --yes-bg:#dcf4ea; --no:#b3294a; --no-bg:#fde3ea;
  --shadow:0 1px 2px rgba(26,32,56,.08),0 8px 24px rgba(26,32,56,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121629; --surface:#1d2540; --ink:#eaedf9; --muted:#9aa4c7; --line:#2e3858;
    --brand:#8b9bff; --brand-ink:#10142a;
    --yes:#5fe0b0; --yes-bg:#12382e; --no:#ff8fa8; --no-bg:#42182a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121629; --surface:#1d2540; --ink:#eaedf9; --muted:#9aa4c7; --line:#2e3858;
  --brand:#8b9bff; --brand-ink:#10142a;
  --yes:#5fe0b0; --yes-bg:#12382e; --no:#ff8fa8; --no-bg:#42182a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.45; min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}
h1{font-size:1.25rem;margin:0;font-weight:700}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:42px;height:42px;cursor:pointer;font-size:1.1rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tab{border:0;background:none;padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.sel{flex:1 1 220px;min-width:0;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;cursor:pointer}
.chip{height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;cursor:pointer;font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);color:var(--brand)}

/* flashcard */
.stage{perspective:1400px}
.card{position:relative;width:100%;min-height:clamp(260px,52vh,420px);cursor:pointer;
  transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1);border:0;background:none;padding:0;text-align:inherit;display:block}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:28px 24px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face .topic{position:absolute;top:16px;left:20px;right:20px;color:var(--muted);font-size:.9rem;text-align:left}
.face .txt{font-size:clamp(1.25rem,3.6vw,1.9rem);font-weight:700;max-width:34ch;text-wrap:balance}
.face .hint{position:absolute;bottom:14px;color:var(--muted);font-size:.85rem}
.back{transform:rotateY(180deg)}
.back.yes{background:var(--yes-bg);border-color:var(--yes)}
.back.no{background:var(--no-bg);border-color:var(--no)}
.verdict{font-size:clamp(2.4rem,9vw,4rem);font-weight:700;line-height:1;margin-bottom:14px}
.back.yes .verdict{color:var(--yes)} .back.no .verdict{color:var(--no)}
.back .txt{font-size:clamp(1rem,2.6vw,1.2rem);font-weight:400;color:var(--ink);opacity:.9}
.nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px}
.nav .big{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.4rem;box-shadow:var(--shadow)}
.nav .big:disabled{opacity:.35;cursor:default}
.count{min-width:90px;text-align:center;font-weight:700}
.progress{height:6px;background:var(--line);border-radius:99px;margin-top:16px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* list */
.group{margin-bottom:22px}
.group h2{font-size:1.05rem;margin:0 0 8px;padding:6px 2px;position:sticky;top:0;background:var(--bg);z-index:2}
.group h2 small{color:var(--muted);font-weight:400;margin-left:6px}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row .t{flex:1}
.badge{flex:none;font-weight:700;font-size:.9rem;padding:4px 10px;border-radius:99px;min-width:64px;text-align:center}
.badge.yes{background:var(--yes-bg);color:var(--yes)} .badge.no{background:var(--no-bg);color:var(--no)}
.hide .row{cursor:pointer}
.hide .row .badge{background:var(--line);color:transparent;user-select:none}
.hide .row.shown .badge.yes{background:var(--yes-bg);color:var(--yes)}
.hide .row.shown .badge.no{background:var(--no-bg);color:var(--no)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.card{transition:none}.progress>i{transition:none}}
@media (max-width:520px){.wrap{padding:12px}.tab{padding:9px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Algoritmusok – beugró</h1>
    <button class="icon-btn" id="theme" aria-label="Sötét/világos téma váltása" title="Téma">◐</button>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist" aria-label="Nézet">
      <button class="tab" role="tab" id="tab-cards" aria-selected="true">Kártyák</button>
      <button class="tab" role="tab" id="tab-list" aria-selected="false">Lista</button>
    </div>
    <select class="sel" id="topic" aria-label="Téma"></select>
    <button class="chip" id="shuffle" aria-pressed="false">Keverés</button>
    <button class="chip" id="hideAns" aria-pressed="false" hidden>Válaszok elrejtése</button>
  </div>

  <section id="cardsView">
    <div class="stage">
      <button class="card" id="card" aria-live="polite">
        <div class="face front"><div class="topic" id="fTopic"></div><div class="txt" id="fTxt"></div><div class="hint">Koppints a megfordításhoz</div></div>
        <div class="face back" id="back"><div class="verdict" id="bVerdict"></div><div class="txt" id="bTxt"></div></div>
      </button>
    </div>
    <div class="nav">
      <button class="big" id="prev" aria-label="Előző">←</button>
      <div class="count" id="count"></div>
      <button class="big" id="next" aria-label="Következő">→</button>
    </div>
    <div class="progress"><i id="bar"></i></div>
  </section>

  <section id="listView" hidden></section>
</div>

<script>
const DATA = [{"n": "Imperatív paradigmára jellemző", "i": [{"t": "Többszöri értékadás megengedett", "a": true}, {"t": "Jelenleg a leggyakrabban használt modell", "a": true}, {"t": "A funkcionális programozás egy fajtájának tekinthetők", "a": false}, {"t": "A változók nem múltérzékenyek", "a": false}, {"t": "A program végrehajtása nehezen párhuzamosítható", "a": true}, {"t": "A változók múltérzékenyek", "a": true}, {"t": "A funkcionális nyelvek alapján fejlesztették ki", "a": false}, {"t": "Napjainkban a legelterjedtebb", "a": true}, {"t": "Alacsony absztrakciós szint", "a": true}, {"t": "Memória állapota határozza meg", "a": true}, {"t": "Értékadó utasításokat tartalmaz", "a": true}, {"t": "Sorrendiséget követi", "a": true}, {"t": "Vannak mellékhatások", "a": true}, {"t": "Általános számítási feladatokat lát el", "a": true}]}, {"n": "Funkcionális paradigmára jellemző", "i": [{"t": "A programleírás deklaratív", "a": true}, {"t": "A program végrehajtása jól párhuzamosítható", "a": true}, {"t": "Napjainkban a legelterjedtebb programozási paradigma", "a": false}, {"t": "Programok alapja a Horn logika", "a": false}, {"t": "Nincsenek mellékhatások", "a": true}, {"t": "A változók nem múltérzékenyek", "a": true}, {"t": "Alapja a lambda kalkulus", "a": true}]}, {"n": "Logikai programozás paradigmára jellemző", "i": [{"t": "A változók múltérzékenyek", "a": false}, {"t": "A változók nem múltérzékenyek", "a": true}, {"t": "A programleírás imperatív", "a": false}, {"t": "A programok csak elágazást, ciklust és szekvenciát használhatnak", "a": false}, {"t": "A problémaleírás alapelemei a változók és velük végzett műveletek", "a": false}, {"t": "Alkalmas szakértői rendszerek fejlesztésére", "a": true}, {"t": "A programleírás deklaratív", "a": true}, {"t": "A programok alapja a Horn logika", "a": true}]}, {"n": "OOP", "i": [{"t": "Egységbezárás, öröklődés, kompozíció, polimorfizmus", "a": true}, {"t": "Magasabb absztrakciós szint", "a": true}, {"t": "Imperatív megvalósítást feltételez", "a": true}, {"t": "Alapelemei objektumok", "a": true}]}, {"n": "Interfész", "i": [{"t": "Interfészek segítségével elérhető a polimorfizmus", "a": true}, {"t": "Egy interfész több másik interfésznek is lehet őse", "a": true}, {"t": "Egy interfészt több osztály is megvalósíthat", "a": true}, {"t": "Egy interfész több interfészt is kiterjeszthet", "a": true}, {"t": "Lehet virtuális konstruktora", "a": false}, {"t": "Interfésznek is lehetnek típusparaméterei", "a": true}, {"t": "Csak interfészek segítségével érhető el a polimorfizmus", "a": false}, {"t": "Minden interfésznek csak egy osztály őse lehet", "a": false}, {"t": "Lehet interfész típusú változót létrehozni", "a": true}, {"t": "Elősegíti a polimorfizmust, de van interfész nélkül is polimorfizmus", "a": true}, {"t": "Nem tartalmazhat konstruktort, destruktort, megvalósított metódust, (láthatósági és sima) mezőket", "a": true}]}, {"n": "Késői kötés jellemzői", "i": [{"t": "Interfészek használatát igényli", "a": false}, {"t": "Futásidőben gyorsabb mint a korai kötés", "a": false}, {"t": "Másnéven eseménykezelés", "a": false}, {"t": "Futásidőben lassabb mint a korai kötés", "a": true}, {"t": "Csak azok a nyelvek támogatják, ahol van többszörös öröklődés", "a": false}, {"t": "A hivatkozott objektum típusa dönti el, hogy melyik metódus fut le", "a": true}, {"t": "Futásidőben dől el, hogy melyik metódus fut le", "a": true}, {"t": "Nagyobb tárigény", "a": true}]}, {"n": "Dijkstra algoritmusa", "i": [{"t": "Mohó algoritmus", "a": true}, {"t": "Meghatározza minden csúcsból az összes többi csúcsba vezető összes út hosszát", "a": false}, {"t": "Nem használható, ha van negatív él a gráfban", "a": true}, {"t": "Megtalálja egy csúcs és az összes többi elérhető csúcs közötti legrövidebb utat", "a": true}, {"t": "Használható, ha van negatív él a gráfban", "a": false}, {"t": "Mindig használható, ha van legalább egy nem negatív út bármelyik két csúcs között", "a": false}, {"t": "A gráf egyik minimális feszítőfáját adja vissza", "a": false}, {"t": "Megtalálja a két bemenetként megadott csúcs között a legrövidebb utat", "a": true}, {"t": "Megtalálja egy gráf minden csúcsából minden csúcsába vezető legrövidebb utat", "a": false}]}, {"n": "Mohó algoritmusokra jellemző", "i": [{"t": "Mindig a lokálisan legjobbnak tűnő megoldásokat választják", "a": true}, {"t": "Általában gyorsan megtalálják a megoldást", "a": true}, {"t": "Ha van mohó megoldás, akkor célszerű azt választani", "a": true}, {"t": "Dijkstra algoritmusa mohó stratégián alapul", "a": true}, {"t": "Szétválasztás és korlátozás módszer mohó stratégiát alkalmaz", "a": false}, {"t": "A 0-1 hátizsákprobléma nem oldható meg mohó algoritmussal", "a": true}, {"t": "Soha nem adnak optimális megoldást, csak közelítik azt", "a": false}]}, {"n": "Hasító táblázatokra jellemző", "i": [{"t": "Az ideális hasítófüggvény a növekvő kulcsokat növekvő indexekre képezi", "a": false}, {"t": "Minden esetben gyorsabbak, mint a többi adatszerkezet", "a": false}, {"t": "Szöveg típusú kulcs nem használható", "a": false}, {"t": "Az osztó módszernél 2 hatványát célszerű paraméternek választani", "a": true}, {"t": "A keresés és módosítás műveletek sebessége a kulcsütközésektől függ", "a": true}, {"t": "Előfordulhatnak benne kulcsütközések", "a": true}]}, {"n": "Generikus metódus jellemzői", "i": [{"t": "Meghíváskor derül ki a generikus típus tényleges értéke", "a": true}, {"t": "Egy generikus osztály minden metódusa generikus", "a": false}, {"t": "Tartozhat generikus vagy nem generikus osztályhoz", "a": true}, {"t": "Csak generikus osztálynak lehet generikus metódusa", "a": false}]}, {"n": "Egy T interfészt megvalósító osztály egy példányára hivatkozhatunk", "i": [{"t": "T referenciával", "a": true}, {"t": "Az osztály bármely leszármazottjának referenciájával", "a": true}, {"t": "Tetszőleges interfész típusú referenciával", "a": false}, {"t": "Tetszőleges osztály referenciával", "a": false}]}, {"n": "Polimorfizmus", "i": [{"t": "Konstruktorok nem lehetnek virtuálisak", "a": true}, {"t": "Objektumok létrehozása a célja", "a": false}, {"t": "Statikus metódusokkal nem valósítható meg", "a": true}, {"t": "Csak olyan nyelveken valósítható meg, ahol van interfész", "a": false}]}, {"n": "Topologikus rendezés", "i": [{"t": "Akkor is előállítható, ha van kör a gráfban", "a": false}, {"t": "Egy csúcs többször is szerepelhet a kimenetben", "a": false}, {"t": "Nem összefüggő gráfok esetén is értelmezhető", "a": true}, {"t": "Nem értelmezhető, ha van kör a gráfban", "a": true}]}, {"n": "Sűrű gráf jellemzői", "i": [{"t": "Lehet irányított", "a": true}, {"t": "Csúcsmátrixban nem lehet eltárolni", "a": false}, {"t": "Tartalmazhat kört", "a": true}, {"t": "Lehet súlyozott", "a": true}, {"t": "A csúcsok számához képest kevés élük van", "a": false}, {"t": "Egy csúcsból indított szélességi bejárás mindig elér minden csúcsot", "a": false}]}, {"n": "Ritka gráf jellemzői", "i": [{"t": "A csúcsok számához képest kevés élük van", "a": true}, {"t": "Egy csúcsból indított szélességi bejárás mindig elér minden csúcsot", "a": false}, {"t": "Szomszédsági listával nem lehet eltárolni", "a": false}, {"t": "Tartalmazhat kört", "a": true}, {"t": "Lehet irányított", "a": true}]}];

const $ = id => document.getElementById(id);
const state = {view:'cards', topic:'all', shuffle:false, hide:false, idx:0, deck:[]};

// téma
const root = document.documentElement;
const saved = (()=>{try{return localStorage.getItem('theme')}catch(e){return null}})();
if(saved) root.dataset.theme = saved;
$('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try{localStorage.setItem('theme', root.dataset.theme)}catch(e){}
};

// témaválasztó
const sel = $('topic');
sel.innerHTML = `<option value="all">Minden téma (${DATA.reduce((s,t)=>s+t.i.length,0)})</option>` +
  DATA.map((t,i)=>`<option value="${i}">${esc(t.n)} (${t.i.length})</option>`).join('');
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function items(){
  const src = state.topic==='all' ? DATA.map((t,i)=>[t,i]) : [[DATA[+state.topic], +state.topic]];
  return src.flatMap(([t])=>t.i.map(x=>({...x, topic:t.n})));
}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildDeck(){ const a=items(); state.deck = state.shuffle ? shuffled(a) : a; state.idx=0; }

// kártyák
const card = $('card');
function showCard(){
  const n = state.deck.length;
  if(!n){ $('count').textContent='0 / 0'; return; }
  const c = state.deck[state.idx];
  card.classList.remove('flipped');
  $('fTopic').textContent = c.topic;
  $('fTxt').textContent = c.t;
  $('bTxt').textContent = c.t;
  $('bVerdict').textContent = c.a ? 'Igaz' : 'Hamis';
  $('back').className = 'face back ' + (c.a?'yes':'no');
  $('count').textContent = `${state.idx+1} / ${n}`;
  $('bar').style.width = ((state.idx+1)/n*100)+'%';
  $('prev').disabled = state.idx===0;
  $('next').disabled = state.idx===n-1;
}
const flip = () => card.classList.toggle('flipped');
const go = d => { const j=state.idx+d; if(j>=0&&j<state.deck.length){state.idx=j; showCard();} };
card.onclick = flip;
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);

// lista
function renderList(){
  const src = state.topic==='all' ? DATA : [DATA[+state.topic]];
  $('listView').className = state.hide ? 'hide' : '';
  $('listView').innerHTML = src.map(t=>`
    <div class="group"><h2>${esc(t.n)}<small>${t.i.length}</small></h2>
    ${t.i.map(x=>`<div class="row" ${state.hide?'role="button" tabindex="0"':''}><span class="t">${esc(x.t)}</span><span class="badge ${x.a?'yes':'no'}">${x.a?'Igaz':'Hamis'}</span></div>`).join('')}
    </div>`).join('');
}
$('listView').addEventListener('click',e=>{
  const r=e.target.closest('.row'); if(r&&state.hide) r.classList.toggle('shown');
});
$('listView').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('row')&&state.hide){e.preventDefault();e.target.classList.toggle('shown');}
});

// nézetváltás
function setView(v){
  state.view=v;
  $('tab-cards').setAttribute('aria-selected',v==='cards');
  $('tab-list').setAttribute('aria-selected',v==='list');
  $('cardsView').hidden = v!=='cards';
  $('listView').hidden = v!=='list';
  $('shuffle').hidden = v!=='cards';
  $('hideAns').hidden = v!=='list';
  if(v==='list') renderList(); else showCard();
}
$('tab-cards').onclick = () => setView('cards');
$('tab-list').onclick = () => setView('list');
sel.onchange = () => { state.topic=sel.value; buildDeck(); setView(state.view); };
$('shuffle').onclick = e => { state.shuffle=!state.shuffle; e.currentTarget.setAttribute('aria-pressed',state.shuffle); buildDeck(); showCard(); };
$('hideAns').onclick = e => { state.hide=!state.hide; e.currentTarget.setAttribute('aria-pressed',state.hide); renderList(); };

// billentyűzet + swipe
document.addEventListener('keydown',e=>{
  if(state.view!=='cards'||e.target===sel) return;
  if(e.key==='ArrowRight') go(1);
  else if(e.key==='ArrowLeft') go(-1);
  else if(e.key===' '&&e.target!==card){e.preventDefault();flip();}
});
let sx=null;
card.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
card.addEventListener('touchend',e=>{
  if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)>60){ go(dx<0?1:-1); card.dataset.swiped='1'; setTimeout(()=>delete card.dataset.swiped,50); }
});
card.addEventListener('click',e=>{ if(card.dataset.swiped) e.stopImmediatePropagation(); },true);

buildDeck(); setView('cards');
</script>
